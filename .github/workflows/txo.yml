name: 台指週選盤面

on:
  schedule:
    # 時間為 UTC（台北 = UTC+8），只在交易時段每半小時跑一次，週一到週五
    # 日盤：台北 08:45–13:45
    - cron: "52 0 * * 1-5"
    - cron: "8,38 1-5 * * 1-5"
    # 夜盤：台北 15:15–隔天 04:45
    - cron: "8,38 7-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: txo-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓資料並產生頁面
        run: python txo_report.py --history-at-close
      - name: 存回 repo
        run: |
          git config user.name "txo-bot"
          git config user.email "txo-bot@users.noreply.github.com"
          git add docs history
          git diff --cached --quiet && exit 0
          git commit -m "更新盤面 $(TZ=Asia/Taipei date '+%F %H:%M')"
          git pull --rebase origin main
          git push
