name: 策略即時訊號

on:
  # 2026-11-24 起改在 Monkey 的 Windows 電腦用工作排程器跑（windows/），GitHub 這邊不再排程，
  # 只留手動觸發當備用。原版 txo-dashboard 因為鬧鐘與高頻排程被 GitHub 以違反 ToS 停用。
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: strategy-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # 排隊等 concurrency 的期間 main 可能已經有新 commit，從最新的開始算，免得推的時候衝突
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 抓即時 1 分K，算 v3（限時段）目前狀態
        run: python strategy/live.py --out docs
      - name: 存回 repo
        run: |
          git config user.name "txo-bot"
          git config user.email "txo-bot@users.noreply.github.com"
          git add docs/live.html docs/live.json docs/trades.html docs/options.html history/option_trades.json history/tx_1min
          git diff --cached --quiet && exit 0
          git commit -m "策略訊號 $(TZ=Asia/Taipei date '+%F %H:%M')"
          for i in 1 2 3 4 5; do
            # 產生的網頁／json 衝突時用這次剛算的（-X theirs 在 rebase 時指自己的 commit）
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
