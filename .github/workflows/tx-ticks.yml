name: 累積台指期 1 分K

on:
  # 2026-11-24 起改在 Monkey 的 Windows 電腦每天 06:32 跑（windows/run_live.ps1 -Daily），GitHub 不再排程，只留手動觸發當備用。
  workflow_dispatch: {}

permissions:
  contents: write

# 和策略即時訊號寫同一批檔案（docs/live.*、history/tx_1min），排同一組才不會同時改到
concurrency:
  group: strategy-live
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # 排隊等 concurrency 的期間 main 可能已經有新 commit，從最新的開始算，免得推的時候衝突
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 下載期交所每筆成交並轉成 1 分K
        run: python strategy/collect_ticks.py history/tx_1min
      - name: 下載期交所台指選擇權（含週選）每筆成交
        # 選擇權失敗不擋期貨與策略頁，下次排程會再補（期交所留 30 個交易日）
        continue-on-error: true
        run: python strategy/collect_option_ticks.py history/txo_ticks
      - name: v3 前測（模擬交易紀錄與網頁）
        run: cd strategy && python forward.py ../history/tx_1min ../docs/strategy.html ../history/forward_trades.csv
      - name: v3（限時段）即時訊號頁與成交紀錄
        run: python strategy/live.py --out docs
      - name: 存回 repo
        run: |
          git config user.name "txo-bot"
          git config user.email "txo-bot@users.noreply.github.com"
          git add history/tx_1min history/txo_ticks history/forward_trades.csv docs/strategy.html docs/live.html docs/live.json docs/trades.html docs/options.html history/option_trades.json
          git diff --cached --quiet && exit 0
          git commit -m "累積台指期 1 分K、台指選擇權逐筆 $(TZ=Asia/Taipei date '+%F')"
          for i in 1 2 3 4 5; do
            # 產生的網頁／json 衝突時用這次剛算的（-X theirs 在 rebase 時指自己的 commit）
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
