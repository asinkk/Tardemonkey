name: 編譯 Windows EXE
on:
  workflow_dispatch: {}
  push:
    paths: ["txo_data.py", "txo_extra.py", "txo_report.py", "template.html"]
permissions:
  contents: write
# 連續推兩次時，避免兩個編譯同時刪建同一個 Release
concurrency:
  group: build-exe
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: PyInstaller
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name txo_report --add-data "template.html;." txo_report.py
      - name: 發佈到 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete exe-latest -y --cleanup-tag || true
          gh release create exe-latest dist/txo_report.exe --title "txo_report.exe（Windows）" --notes "雙擊執行：抓期交所資料並在瀏覽器開啟盤面。排程用 txo_report.exe --no-open。" --latest
