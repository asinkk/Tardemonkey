<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>台指策略即時訊號</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --fg:#1b1f24; --muted:#5d6673; --line:#dfe3e8; --up:#c2412d; --dn:#2f7d5b;
  --accent:#2f5fd0; --warn:#a86500; --warnbg:#fff4e0; --sigbg:#e8efff;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171b; --panel:#1c2026; --fg:#e8ebef; --muted:#9aa3ae; --line:#2c323a;
  --up:#ef7a63; --dn:#5cc296; --accent:#7ea2ff; --warn:#f0b35a; --warnbg:#3a2c14; --sigbg:#1e2a48; color-scheme:dark; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.5; }
main { max-width:720px; margin:0 auto; padding:16px; }
h1 { font-size:20px; margin:0; } h2 { font-size:17px; margin:0; }
.sub, .note, .asof { color:var(--muted); font-size:12.5px; margin:4px 0; }
.top { display:flex; justify-content:space-between; align-items:flex-end; gap:8px; flex-wrap:wrap; }
.price { font-size:28px; font-variant-numeric:tabular-nums; margin:0; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-top:12px; }
.ch { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.state { font-weight:600; padding:4px 10px; border-radius:999px; white-space:nowrap; font-size:14px; border:1px solid var(--line); }
.state.long { color:#fff; background:var(--up); border-color:var(--up); }
.state.short { color:#fff; background:var(--dn); border-color:var(--dn); }
.state.flat { color:var(--muted); }
.kv { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 4px; }
.kv div { border:1px solid var(--line); border-radius:8px; padding:8px; }
.kv > div > span { display:block; font-size:12px; color:var(--muted); }
.kv b { display:block; font-size:19px; font-weight:600; font-variant-numeric:tabular-nums; }
.kv em { display:block; font-style:normal; font-size:12px; color:var(--muted); }
.alert { background:var(--warnbg); color:var(--warn); border-radius:8px; padding:8px 10px; margin:8px 0; font-size:14px; }
.alert.sig { background:var(--sigbg); color:var(--accent); font-weight:600; }
.lv { font-size:12.5px; color:var(--muted); border-top:1px dashed var(--line); padding-top:8px; margin:10px 0 0; font-variant-numeric:tabular-nums; }
details.side { border:1px solid var(--line); border-radius:8px; margin:6px 0; padding:0 10px; }
details.side summary { padding:8px 0; cursor:pointer; font-weight:600; }
.pill { font-size:12px; font-weight:500; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:1px 8px; margin-left:6px; }
.pill.go { color:#fff; background:var(--accent); border-color:var(--accent); }
.gt { font-size:12.5px; color:var(--muted); margin:8px 0 2px; }
ul.ck { list-style:none; padding:0; margin:0 0 6px; }
ul.ck li { display:grid; grid-template-columns:20px 1fr auto; gap:6px; padding:3px 0; font-size:14px; }
ul.ck li.ok .mk { color:var(--accent); font-weight:700; } ul.ck li.no { color:var(--muted); }
.dt { font-size:12px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
.up { color:var(--up); } .dn { color:var(--dn); }
a { color:var(--accent); }
footer { margin:20px 0 40px; }
</style></head><body><main>
<div id="app"><p class="note">讀取 Google 試算表中…</p></div>
<footer>
<p class="note">資料來源：Google 試算表「台指策略訊號（Google 獨立版）」的「即時訊號」分頁，由試算表裡的 Apps Script 自己跟期交所抓資料、計算 v3 與 D2。
這頁每 2 分鐘重新讀一次試算表，不需要 GitHub Actions。・<a id="sheetlink" href="#">開啟試算表</a>・<a id="tradeslink" href="#">成交紀錄分頁</a></p>
</footer>
</main>
<script>
(function () {
  // ====== 設定：試算表 ID 與分頁 gid（網址 .../d/<ID>/edit#gid=<gid>） ======
  var SHEET_ID = "1alKWuFBKX5fHF9nv_UMHrhag6m92bA2Q69xmEJF14tk";
  var GID_LIVE = "0";            // 即時訊號
  var GID_TRADES = "924864982";  // 成交紀錄
  var REFRESH_MS = 2 * 60 * 1000;
  // 試算表要設成「知道連結的任何人都能檢視」，這個網址才讀得到
  var CSV_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/export?format=csv&gid=" + GID_LIVE;
  var EDIT_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/edit";

  document.getElementById("sheetlink").href = EDIT_URL + "#gid=" + GID_LIVE;
  document.getElementById("tradeslink").href = EDIT_URL + "#gid=" + GID_TRADES;
  var app = document.getElementById("app");

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function parseCSV(t) {
    var rows = [], row = [], f = "", q = false;
    for (var i = 0; i < t.length; i++) {
      var c = t[i];
      if (q) {
        if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; }
        else f += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && t[i + 1] === "\n") i++;
        row.push(f); rows.push(row); row = []; f = "";
      } else f += c;
    }
    if (f !== "" || row.length) { row.push(f); rows.push(row); }
    return rows.map(function (r) {
      r = r.map(function (x) { return x.trim(); });
      while (r.length && r[r.length - 1] === "") r.pop();
      return r;
    });
  }

  // 空白列把分頁切成一塊一塊：頁首、v3、D2、v3 交易、D2 交易、說明
  function blocks(rows) {
    var out = [], cur = [];
    rows.forEach(function (r) {
      if (!r.length) { if (cur.length) out.push(cur); cur = []; }
      else cur.push(r);
    });
    if (cur.length) out.push(cur);
    return out;
  }

  function nonEmpty(r) { return r.filter(function (x) { return x !== ""; }).length; }
  function stateClass(s) {
    if (/持多|多單/.test(s)) return "long";
    if (/持空|空單/.test(s)) return "short";
    return "flat";
  }
  function signed(v) {
    var e = esc(v);
    if (/^\+\d/.test(v)) return '<span class="up">' + e + "</span>";
    if (/^-\d/.test(v)) return '<span class="dn">' + e + "</span>";
    return e;
  }

  function renderHeader(b) {
    var r0 = b[0] || [], r1 = b[1] || [], r2 = b[2] || [];
    return '<div class="top"><div><h1>' + esc(r0[0] || "台指策略即時訊號") + "</h1>" +
      '<p class="asof">' + esc(r1[0] || "") + '（<span id="age">' + esc(r1[4] || "") + "</span>）</p></div>" +
      '<div style="text-align:right"><p class="price">' + esc(r0[5] || "") + "</p>" +
      '<p class="asof">' + esc(r2[0] || r0[4] || "") + "</p></div></div>" +
      '<p class="alert" id="stale" hidden></p>' +
      b.slice(3).map(function (r) { return '<p class="alert">' + esc(r.join(" ")) + "</p>"; }).join("");
  }

  var GROUPS = { "突破進場": 1, "拉回進場": 1, "進場條件": 1 };

  function renderStrategy(b) {
    var h = '<section class="card"><div class="ch"><div><h2>' + esc(b[0][0]) + "</h2>";
    var i = 1;
    if (b[1] && nonEmpty(b[1]) === 1 && b[1][0]) { h += '<p class="sub">' + esc(b[1][0]) + "</p>"; i = 2; }
    h += "</div>" + (b[0][5] ? '<span class="state ' + stateClass(b[0][5]) + '">' + esc(b[0][5]) + "</span>" : "") + "</div>";
    var inList = false, inSide = false, inDetails = false;
    function closeList() { if (inList) { h += "</ul>"; inList = false; } }
    function closeSide() { closeList(); if (inSide) { h += "</details>"; inSide = false; } }
    for (; i < b.length; i++) {
      var r = b[i], a = r[0] || "";
      if (a === "✓" || a === "✗") {
        if (!inList) { h += '<ul class="ck">'; inList = true; }
        var ok = a === "✓";
        h += '<li class="' + (ok ? "ok" : "no") + '"><span class="mk">' + a + "</span><span>" + esc(r[1] || "") +
          '</span><span class="dt">' + esc(r[3] || r[2] || "") + "</span></li>";
        continue;
      }
      closeList();
      if ((a === "做多" || a === "做空") && r[1]) {
        closeSide();
        h += '<details class="side"' + (r[1] === "成立" ? " open" : "") + "><summary>" + esc(a) +
          ' <span class="pill' + (r[1] === "成立" ? " go" : "") + '">' + esc(r[1]) + "</span></summary>";
        inSide = true;
        continue;
      }
      if (nonEmpty(r) >= 3) {  // 進場／停損／未實現… 標題列，下一列是數值，再下一列（2 格以上）是說明
        closeSide();
        var vals = b[i + 1] || [], ems = (b[i + 2] && nonEmpty(b[i + 2]) >= 2) ? b[i + 2] : [];
        h += '<div class="kv">' + r.map(function (lab, k) {
          return "<div><span>" + esc(lab) + "</span><b>" + signed(vals[k] || "") + "</b>" + (ems[k] ? "<em>" + esc(ems[k]) + "</em>" : "") + "</div>";
        }).join("") + "</div>";
        i += ems.length ? 2 : 1;
        continue;
      }
      var t = r.filter(function (x) { return x !== ""; }).join(" ");
      if (inSide && GROUPS[t]) { h += '<p class="gt">' + esc(t) + "</p>"; continue; }
      if (/^進場條件/.test(t)) {
        closeSide();
        if (inDetails) h += "</details>";
        h += "<details" + (/持倉中/.test(t) ? "" : " open") + '><summary class="sub">' + esc(t) + "</summary>";
        inDetails = true;
        continue;
      }
      if (/^若現在進場/.test(t)) { closeList(); h += '<p class="note">' + esc(t) + "</p>"; continue; }
      closeSide();
      if (/^⚠/.test(t)) h += '<p class="alert">' + esc(t) + "</p>";
      else if (/訊號/.test(t)) h += '<p class="alert sig">' + esc(t) + "</p>";
      else if (/^最後一根/.test(t)) h += '<p class="sub">' + esc(t) + "</p>";
      else if (/EMA/.test(t) && /ATR/.test(t) && !/保本/.test(t)) h += '<p class="lv">' + esc(t) + "</p>";
      else h += '<p class="note">' + esc(t) + "</p>";
    }
    closeSide();
    if (inDetails) h += "</details>";
    return h + "</section>";
  }

  function renderPlain(b) {
    var title = b[0].length === 1 && b[0][0].length <= 20;
    var h = title ? '<section class="card"><h2>' + esc(b[0][0]) + "</h2>" : "<section>";
    b.slice(title ? 1 : 0).forEach(function (r, k) {
      var t = r.filter(function (x) { return x !== ""; }).join(" ");
      var cls = title && k === 0 ? "sub" : "note";
      var html = esc(t).replace("「成交紀錄」分頁", '<a href="' + EDIT_URL + "#gid=" + GID_TRADES + '">「成交紀錄」分頁</a>');
      h += '<p class="' + cls + '">' + html + "</p>";
    });
    return h + "</section>";
  }

  function render(rows) {
    var bs = blocks(rows);
    if (!bs.length) throw new Error("試算表是空的");
    var h = renderHeader(bs[0]);
    bs.slice(1).forEach(function (b) {
      h += (b[0][5] ? renderStrategy(b) : renderPlain(b));
    });
    app.innerHTML = h;
    checkStale(bs[0][1] && bs[0][1][5]);
  }

  // 試算表在交易時段每 15 分鐘更新；超過 40 分鐘沒更新就提醒
  function checkStale(stamp) {
    var m = /(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d)/.exec(stamp || "");
    if (!m) return;
    var gen = new Date(m[1] + "-" + m[2] + "-" + m[3] + "T" + m[4] + ":" + m[5] + ":00+08:00"), now = new Date();
    var mins = Math.round((now - gen) / 60000);
    var age = document.getElementById("age");
    if (age) age.textContent = "試算表 " + (mins < 1 ? "剛剛" : mins < 120 ? mins + " 分鐘前" : Math.round(mins / 60) + " 小時前") + "更新";
    var tp = new Date(now.getTime() + (now.getTimezoneOffset() + 480) * 60000);
    var wd = tp.getDay(), t = tp.getHours() * 60 + tp.getMinutes();
    var open = (wd >= 1 && wd <= 5 && t >= 525 && t <= 825) || (wd >= 1 && wd <= 5 && t >= 900) || (wd >= 2 && wd <= 6 && t <= 300);
    if (open && mins > 40) {
      var el = document.getElementById("stale");
      el.hidden = false;
      el.textContent = "⚠ 交易時段中，試算表已經 " + (mins < 120 ? mins + " 分鐘" : Math.round(mins / 60) + " 小時") +
        "沒有更新（自動更新可能沒開，或 Google 排程延遲），價格、停損與訊號可能過時。";
    }
  }

  function showError(msg) {
    app.innerHTML = '<div class="top"><div><h1>台指策略即時訊號</h1></div></div>' +
      '<p class="alert">讀不到 Google 試算表：' + esc(msg) + "</p>" +
      '<p class="note">請確認試算表已設成「共用 → 一般存取權：知道連結的任何人 → 檢視者」。設定好之後重新整理這頁。</p>';
  }

  function load() {
    fetch(CSV_URL, { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    }).then(function (t) {
      if (/^\s*<(!doctype|html)/i.test(t)) throw new Error("試算表沒有公開分享（回傳的是登入頁）");
      render(parseCSV(t));
    }).catch(function (e) {
      // 已經顯示過資料就保留舊畫面，只有第一次讀取失敗才顯示錯誤
      if (!document.querySelector(".card")) showError(e.message || String(e));
    });
  }

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body></html>
